# Weekly data refresh and retrain; setup steps are in the README.
weekly-data:
  image: python:3.13-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  timeout: 1h
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq libgomp1 > /dev/null
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash - > /dev/null
    - apt-get install -y -qq nodejs > /dev/null
    - corepack enable
    - pnpm install --frozen-lockfile
    - python -m venv .venv
    - .venv/bin/pip install -q -r scripts/model/requirements.txt
  script:
    - pnpm refresh
    - pnpm data
    - pnpm test
    - pnpm build
    - git config user.name "soko-mbele-bot"
    - git config user.email "soko-mbele-bot@noreply.$CI_SERVER_HOST"
    - git add data/
    - |
      if git diff --cached --quiet; then
        echo "No new data this week."
      else
        git commit -m "Weekly data and model: $(date -u +%Y-%m-%d)"
        git push "https://oauth2:${DATA_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
      fi
